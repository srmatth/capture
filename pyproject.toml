[project]
name = "matthewshome-capture"
version = "0.1.0"
description = "Personal knowledge capture pipeline (upload · transcribe · OCR · classify · embed · search)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.10",
    "jinja2>=3.1",
    "httpx>=0.28",
    "anthropic>=0.40.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "python-ulid>=3.0",
    "ocrmypdf>=16.0",
    "pillow>=10.4",
    "img2pdf>=0.5",
    "readability-lxml>=0.8",
    "lxml[html_clean]>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
